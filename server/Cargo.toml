[package]
name = "server"
version = "0.2.1"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Async
async-trait = "0.1.83"
futures = "0.3.31"
tokio = { version = "1.37.0", features = ["full"] }
tokio-tungstenite = "0.21.0"

# Logging
log = "0.4.21"
chrono = "0.4.41"
env_filter = "0.1.3"
fern = { version = "0.7.1", features = ["colored", "date-based", "chrono"] }

# Error
thiserror = "1.0.58"
anyhow = "1.0.82"

# Serde
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"

# WebRTC
webrtc = "0.13.0"
volcano-sfu = {path = "../volcano-sfu" }

# CLI
clap = { version = "4.5.40", features = ["derive"] }
